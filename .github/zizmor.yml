rules:
  artipacked:
    ignore:
      # The sync workflow pushes its commit and does not upload artifacts.
      - sync-actions.yml:185
  secrets-outside-env:
    ignore:
      # The compiler emits these runtime token references in generated workflows.
      - daily-runtime-threat-scan.lock.yml
  unpinned-uses:
    ignore:
      # Generated workflows use this repository's immutable release tags.
      - agentics-maintenance.yml
      - daily-runtime-threat-scan.lock.yml
